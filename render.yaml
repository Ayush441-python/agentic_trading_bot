services:
  # ---------------------------------------------
  # 1. FastAPI REST API Service
  # ---------------------------------------------
  - type: web
    name: trading-bot-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false

  # ---------------------------------------------
  # 2. Streamlit Dashboard Frontend Service
  # ---------------------------------------------
  - type: web
    name: trading-bot-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: BACKEND_URL
        fromService:
          type: web
          name: trading-bot-api
          property: host
      - key: GROQ_API_KEY
        sync: false
